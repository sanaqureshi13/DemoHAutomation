name: .NET 8 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore DemoHAutomation.sln

    - name: Build solution
      run: dotnet build DemoHAutomation.sln --configuration Release --no-restore

    - name: Publish Web Project
      run: dotnet publish DemoHAutomation.Web/DemoHAutomation.Web.csproj -c Release -o publish
